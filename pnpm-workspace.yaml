packages:
  - aform
  - atable
  - beam
  - casl_middleware
  - code_editor
  - desktop
  - graphql_client
  - graphql_middleware
  - node_editor
  - nuxt
  - nuxt_grafserv
  - rockfoil
  - schema
  - stonecrop
  - themes
  - tools/doc-gen
  - tools/scripts
  - utilities

# Members are listed one by one rather than globbed. `nuxt/playground`, `nuxt/fullstack` and the
# three `*/test/fixtures/*` apps carry a package.json but are not members: they resolve by walking
# up into their parent package's node_modules. A `*/*` glob
# would adopt them and give each its own node_modules, changing how every one of them resolves
# `nuxt` and `vue`.
resolutionMode: time-based
autoInstallPeers: false

# One range per dependency across every package, which is what `rush check` enforced and nothing in
# pnpm or Vite+ replaced. Every dependency declared by two or more packages is listed here and
# referenced as `catalog:`, so the range cannot diverge between them.
#
# `peerDependencies` deliberately keep literal ranges. A peer range states what a consumer may pair
# this package with, not what we build against, so tying it to the catalog would narrow it silently
# every time a dev dependency is bumped.
#
# `prefer` means `pnpm add` reuses a catalog entry when one exists but does not fail without one; the
# repo-wide check in tools/scripts/check-dependency-consistency.mjs is what catches a dependency
# that lands in two packages without joining the catalog.
catalogMode: prefer
catalog:
  '@eslint/js': '^10.0.1'
  '@microsoft/api-extractor': '^7.58.7'
  '@nuxt/devtools': '^3.2.4'
  '@nuxt/eslint-config': '^1.16.0'
  '@nuxt/kit': '^4.4.4'
  '@nuxt/module-builder': '^1.0.2'
  '@nuxt/schema': '^4.4.8'
  '@nuxt/test-utils': '^4.3.1'
  '@types/node': '^24.12.4'
  '@vitejs/plugin-vue': '^6.0.6'
  # The Vitest family is pinned exactly, at the version vite-plus bundles: each `@vitest/*` package
  # peers on its own exact `vitest`, and a range let one resolve a patch ahead of the rest.
  '@vitest/browser-playwright': '5.0.5'
  '@vitest/coverage-istanbul': '5.0.5'
  '@vitest/ui': '5.0.5'
  '@vue/test-utils': '^2.4.10'
  '@vueuse/components': '^14.2.1'
  '@vueuse/core': '^14.2.1'
  eslint: '^10.6.0'
  graphql: '^16.14.0'
  graphql-yoga: '^5.18.0'
  h3: '^1.15.11'
  immutable: '^5.1.4'
  jsdom: '^29.1.1'
  monaco-editor: '^0.55.1'
  nuxt: '^4.4.8'
  pinia: '^3.0.4'
  playwright: '^1.63.0'
  postgraphile: '^5.0.3'
  # Nuxt imports Rolldown itself and declares it as a peer. Standalone Vite used to install it as a
  # dependency of its own, but vite-plus's core bundles Rolldown, so the two Nuxt packages declare it,
  # at the version vite-plus bundles.
  rolldown: '1.2.14'
  temporal-polyfill: '^1.0.5'
  typescript: '^6.0.3'
  # vite-plus's own core, installed under Vite's name, from the same release as `vite-plus` below.
  # Bumping one without the other, or without the Vitest family above, installs a second toolchain
  # beside the first.
  vite: 'npm:@voidzero-dev/vite-plus-core@1.3.0'
  vite-plugin-lib-inject-css: '^2.2.2'
  vite-plus: '1.3.0'
  vitest: '5.0.5'
  vue: '^3.5.33'
  vue-component-meta: ^3.3.11
  vue-router: '^5.0.6'
  vue-tsc: '^3.3.6'

# Every Vite and Vitest in the graph resolves to the catalog's, including the ones other packages
# depend on (Nuxt's builder, `@vitejs/plugin-vue`, `@nuxt/test-utils`), so vite-plus's toolchain is
# the only one installed. Keyed `@*` so the override replaces version ranges only: a bare key would
# also replace the `catalog:` references in every manifest.
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  # `vite` is vite-plus's core, which carries vite-plus's version number rather than Vite's, so no
  # peer range on Vite can match it.
  allowAny:
    - vite
  ignoreMissing:
    - react
    - react-dom

# pnpm 11 fails an install for any dependency shipping a lifecycle script that is not listed here.
# All four are false, preserving the behavior this repo had under pnpm 10, where none of them ran.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
