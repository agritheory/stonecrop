# The workspace Vite+ reads. Rush installs from its own generated copy in common/temp, so this
# list must stay identical to rush.json's: a member Rush does not know about gets its scripts run
# against an empty node_modules.
#
# The root package.json repeats rush.json's `pnpmVersion` under `devEngines.packageManager`
# because `vp run` writes that block itself, pinned to whatever pnpm it finds, when it is absent.
# Bump both together.
packages:
  - aform
  - atable
  - beam
  - casl_middleware
  - code_editor
  - desktop
  - docs
  - graphql_client
  - graphql_middleware
  - node_editor
  - nuxt
  - nuxt_grafserv
  - rigs/stonecrop-rig
  - rockfoil
  - schema
  - stonecrop
  - themes
  - tools/doc-gen
  - tools/vite-plus
  - utilities
