name: Nuxt Grafserv Tests

# No paths filter, for the reason nuxt.yml gives.
on:
  push:
    branches:
      - development
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VP_GIT_HOOKS: 0

jobs:
  changes:
    name: Detect Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      affected: ${{ steps.affected.outputs.affected }}

    steps:
      # The merge commit and its first parent, the base branch, as in pr.yml.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Check Whether nuxt_grafserv Is Affected
        id: affected
        run: |
          set -o pipefail
          affected=$(node tools/scripts/affected-packages.mjs HEAD^1 | jq 'index("nuxt_grafserv") != null')
          echo "affected=${affected}" >> "$GITHUB_OUTPUT"

  test:
    name: nuxt_grafserv
    needs: [changes]
    # `!cancelled()`, or the push run, where `changes` is skipped, would skip this too.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.affected == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # `{dir}` keeps the traversal suffix that `./dir` drops, so this builds the dependency closure.
      # --fail-if-no-match, or a filter matching nothing exits zero.
      - name: Build
        run: pnpm exec vp run --filter '{nuxt_grafserv}...' --fail-if-no-match build

      - name: Prepare Playground
        working-directory: nuxt_grafserv/
        run: pnpm run dev:prepare

      - name: Run Tests
        working-directory: nuxt_grafserv/
        run: pnpm run test

      # Mirrors nuxt.yml. `pr-checks` now runs test:types repo-wide, but only on
      # pull_request — this workflow also runs on push to development, where nothing else would
      # typecheck this package. Its absence is how 28 type errors accumulated here unseen.
      - name: Type Check
        working-directory: nuxt_grafserv/
        run: pnpm run test:types
