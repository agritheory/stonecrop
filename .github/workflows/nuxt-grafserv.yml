name: Nuxt Grafserv Tests

on:
  # Every push, for the reason nuxt.yml gives.
  push:
    branches:
      - development
  pull_request:
    paths: [nuxt_grafserv/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VP_GIT_HOOKS: 0

jobs:
  test:
    name: nuxt_grafserv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Restored for the reason nuxt.yml gives.
      - name: Restore Build Tasks
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vp-tasks-${{ runner.os }}-

      # `{dir}` keeps the traversal suffix that `./dir` drops, so this builds the dependency closure.
      # --fail-if-no-match, or a filter matching nothing exits zero.
      - name: Build
        run: pnpm exec vp run --filter '{nuxt_grafserv}...' --fail-if-no-match build

      - name: Prepare Playground
        working-directory: nuxt_grafserv/
        run: pnpm run dev:prepare

      - name: Run Tests
        working-directory: nuxt_grafserv/
        run: pnpm run test

      # Push only, as in nuxt.yml. On a pull request `pr-checks` runs test:types repo-wide; a push to
      # development runs no `pr-checks`, so nothing else would typecheck this package there. Its
      # absence is how 28 type errors accumulated here unseen.
      - name: Type Check
        if: github.event_name != 'pull_request'
        working-directory: nuxt_grafserv/
        run: pnpm run test:types
