name: Nuxt Tests

on:
  # Every push, not only nuxt/**: a change to a package nuxt depends on, or to the lockfile, can
  # break it, and coverage-baseline does not test it.
  push:
    branches:
      - development
  pull_request:
    paths: [nuxt/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VP_GIT_HOOKS: 0

jobs:
  test:
    name: nuxt
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Vite+'s task cache, restored after Install, which creates node_modules. On a pull request the
      # newest one PR Checks saved for it, else, as on a push, the one publish-npm saves on development
      # after each release. Restore only: neither builds less than this job.
      - name: Restore Build Tasks
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vp-tasks-${{ runner.os }}-

      # `{dir}` keeps the traversal suffix that `./dir` drops, so this builds the dependency closure.
      # --fail-if-no-match, or a filter matching nothing exits zero.
      #
      # `^...` leaves nuxt itself out. Prepare Playground stubs its dist over whatever a build put
      # there, and every test fixture imports `src/module`, so its own build was discarded unread.
      # PR Checks builds the module on every pull request.
      - name: Build
        run: pnpm exec vp run --filter '{nuxt}^...' --fail-if-no-match build

      - name: Prepare Playground
        working-directory: nuxt/
        run: pnpm run dev:prepare

      - name: Run Tests
        working-directory: nuxt/
        run: pnpm run test

      # Push only. On a pull request, PR Checks' Typecheck runs this same script after a full build, so
      # it ran twice; a push to development runs no PR Checks, so there this is the only typecheck.
      - name: Type Check
        if: github.event_name != 'pull_request'
        working-directory: nuxt/
        run: pnpm run test:types
