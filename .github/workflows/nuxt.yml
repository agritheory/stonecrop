name: Nuxt Tests

on:
  push:
    branches:
      - development
    paths: [nuxt/**]
  pull_request:
    paths: [nuxt/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: nuxt
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache-dependency-path: '**/config/rush/pnpm-lock.yaml'
          registry-url: https://registry.npmjs.org/

      - name: Restore Rush Build Cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: common/temp/build-cache
          key: rush-build-cache-nuxt-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rush-build-cache-nuxt-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-
            rush-build-cache-nuxt-
            rush-build-cache-

      # actions/setup-node's `cache: 'pnpm'` calls `pnpm store path` during
      # setup — before Rush has installed its own managed pnpm binary at ~/.rush/.
      # We cache ~/.rush (the binary) and ~/.local/share/pnpm/store (the package
      # store) explicitly so that rush install can skip downloading all packages.
      - name: Cache Rush pnpm Store
        uses: actions/cache@v5
        with:
          path: |
            ~/.rush
            ~/.local/share/pnpm/store
          key: rush-pnpm-${{ runner.os }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-pnpm-${{ runner.os }}-

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Install Autoinstallers
        run: node common/scripts/install-run-rush.js install-autoinstaller --name rush-plugins

      - name: Rush Build
        run: node common/scripts/install-run-rush.js build --to @stonecrop/nuxt

      - name: Prepare Playground
        working-directory: nuxt/
        run: node ../common/scripts/install-run-rushx.js dev:prepare

      - name: Run Tests
        working-directory: nuxt/
        run: node ../common/scripts/install-run-rushx.js test

      - name: Type Check
        working-directory: nuxt/
        run: node ../common/scripts/install-run-rushx.js test:types

      - name: Save Rush Build Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: common/temp/build-cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
