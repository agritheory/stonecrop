name: Nuxt Tests

on:
  push:
    branches:
      - development
    paths: [nuxt/**]
  pull_request:
    paths: [nuxt/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VP_GIT_HOOKS: 0

jobs:
  test:
    name: nuxt
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec vp run -t '@stonecrop/nuxt#build'

      - name: Prepare Playground
        working-directory: nuxt/
        run: pnpm run dev:prepare

      - name: Run Tests
        working-directory: nuxt/
        run: pnpm run test

      - name: Type Check
        working-directory: nuxt/
        run: pnpm run test:types
