name: Publish Packages

on:
  pull_request:
    branches:
      - development
    types:
      - closed

jobs:
  publish-npm:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - uses: actions/setup-node@v6
        name: Install Node.js
        with:
          node-version: 22
          cache-dependency-path: '**/config/rush/pnpm-lock.yaml'
          registry-url: https://registry.npmjs.org/

      - name: Set Git User
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Restore Rush Build Cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: common/temp/build-cache
          key: rush-build-cache-release-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-build-cache-

      - name: Install Rush
        run: node common/scripts/install-run-rush.js install

      - name: Update Autoinstallers
        run: |
          node common/scripts/install-run-rush.js update-autoinstaller --name doc-tools
          node common/scripts/install-run-rush.js update-autoinstaller --name rush-plugins

      - name: Build Stonecrop
        run: node common/scripts/install-run-rush.js rebuild

      - name: Bump Version for Packages
        run: node common/scripts/install-run-rush.js version --bump --target-branch development --ignore-git-hooks

      - name: Publish Packages via Rush
        run: node common/scripts/install-run-rush.js publish --apply --publish --include-all --version-policy stonecrop --target-branch development --add-commit-details --set-access-level=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Save Rush Build Cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: common/temp/build-cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
