name: Publish Packages

on:
  pull_request:
    branches:
      - development
    types:
      - closed

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish-npm:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - uses: actions/setup-node@v6
        name: Install Node.js
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set Git User
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Restore Rush Build Cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: common/temp/build-cache
          key: rush-build-cache-release-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rush-build-cache-release-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-
            rush-build-cache-release-
            rush-build-cache-

      # actions/setup-node's `cache: 'pnpm'` calls `pnpm store path` during
      # setup — before Rush has installed its own managed pnpm binary at ~/.rush/.
      # We cache ~/.rush (the binary) and ~/.local/share/pnpm/store (the package
      # store) explicitly so that rush install can skip downloading all packages.
      - name: Cache Rush pnpm Store
        uses: actions/cache@v5
        with:
          path: |
            ~/.rush
            ~/.local/share/pnpm/store
          key: rush-pnpm-${{ runner.os }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-pnpm-${{ runner.os }}-

      - name: Install Rush
        run: node common/scripts/install-run-rush.js install

      - name: Update Autoinstallers
        run: |
          node common/scripts/install-run-rush.js update-autoinstaller --name doc-tools
          node common/scripts/install-run-rush.js update-autoinstaller --name rush-plugins

      - name: Build Stonecrop
        run: node common/scripts/install-run-rush.js rebuild

      - name: Bump Version for Packages
        run: node common/scripts/install-run-rush.js version --bump --target-branch development --ignore-git-hooks

      - name: Publish Packages via Rush
        run: node common/scripts/install-run-rush.js publish --apply --publish --include-all --version-policy stonecrop --target-branch development --add-commit-details --set-access-level=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Save Rush Build Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: common/temp/build-cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
