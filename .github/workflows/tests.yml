name: Tests

on:
  # only run when changes are made to specific packages
  pull_request:

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      packages: ${{ steps.filter.outputs.changes }}

    steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          aform: aform/**
          atable: atable/**
          beam: beam/**
          casl_middleware: casl_middleware/**
          nuxt_yoga: nuxt_yoga/**
          rockfoil: rockfoil/**
          stonecrop: stonecrop/**

  test:
    name: ${{ matrix.package }}
    needs: changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache-dependency-path: '**/config/rush/pnpm-lock.yaml'
          registry-url: https://registry.npmjs.org/

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Update Autoinstallers
        run: |
          node common/scripts/install-run-rush.js update-autoinstaller --name doc-tools
          node common/scripts/install-run-rush.js update-autoinstaller --name rush-plugins
          node common/scripts/install-run-rush.js update-autoinstaller --name rush-prettier

      - name: Rush Build
        run: node common/scripts/install-run-rush.js rebuild --verbose

      - name: Run Tests
        working-directory: ./${{ matrix.package }}
        run: node ../common/scripts/install-run-rushx.js test
