name: Docs

on:
  push:
    branches:
      - development
    paths:
      - 'nuxt/documentation/**'
      - 'examples/**'
      - '**/api.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache-dependency-path: '**/config/rush/pnpm-lock.yaml'
          registry-url: https://registry.npmjs.org/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Restore Rush Build Cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: common/temp/build-cache
          key: rush-build-cache-docs-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            rush-build-cache-docs-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-
            rush-build-cache-docs-
            rush-build-cache-

      # actions/setup-node's `cache: 'pnpm'` calls `pnpm store path` during
      # setup — before Rush has installed its own managed pnpm binary at ~/.rush/.
      # We cache ~/.rush (the binary) and ~/.local/share/pnpm/store (the package
      # store) explicitly so that rush install can skip downloading all packages.
      - name: Cache Rush pnpm Store
        uses: actions/cache@v5
        with:
          path: |
            ~/.rush
            ~/.local/share/pnpm/store
          key: rush-pnpm-${{ runner.os }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-pnpm-${{ runner.os }}-

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Install Autoinstallers
        run: |
          node common/scripts/install-run-rush.js install-autoinstaller --name doc-tools
          node common/scripts/install-run-rush.js install-autoinstaller --name rush-plugins

      - name: Rush Build
        run: node common/scripts/install-run-rush.js build

      - name: Build Histoire Stories
        working-directory: ./examples
        run: node ../common/scripts/install-run-rushx.js build:stories

      - name: Generate Docs Site
        working-directory: ./nuxt
        run: node ../common/scripts/install-run-rushx.js generate:documentation

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: nuxt/documentation/.output/public

      - name: Save Rush Build Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: common/temp/build-cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
