name: Docs

on:
  push:
    branches:
      - development
    paths:
      - 'nuxt/documentation/**'
      - '**/api.md'
      - '.github/workflows/docs.yml'
      # The site embeds live components, so a source change alters what it renders even when it
      # leaves every api.md untouched. Globbed rather than listing the packages that supply a
      # demo, which is a set that goes stale silently the next time one is added.
      - '*/src/**'
      - 'themes/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-pages
  cancel-in-progress: false

env:
  VP_GIT_HOOKS: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # The root build ends in `run-docs.sh --aggregate`, which collects every package's api.md into
      # the content tree the site renders. Without that an api.md change would trigger this workflow
      # and then deploy a site that does not contain it.
      - name: Build
        run: pnpm run build

      # The site is deliberately outside the repo-wide build: its script is named "generate:documentation"
      # rather than "build" so that `vp run -r build` does not render it on every package build.
      - name: Generate Docs Site
        run: pnpm --filter @stonecrop/nuxt run generate:documentation

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: nuxt/documentation/.output/public

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
