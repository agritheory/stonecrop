name: Deploy Docs

on:
  push:
    branches:
      - development
    paths:
      - 'docs/**'
      - 'examples/**'
      - '**/api.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'common/config/rush/pnpm-lock.yaml'

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Update Autoinstallers
        run: |
          node common/scripts/install-run-rush.js update-autoinstaller --name doc-tools

      - name: Rush Build
        run: node common/scripts/install-run-rush.js rebuild --verbose

      - name: Build Histoire Stories
        working-directory: ./examples
        run: node ../common/scripts/install-run-rushx.js build:stories

      - name: Aggregate API Docs
        working-directory: ./docs
        run: node scripts/aggregate-api.mjs

      - name: Build VitePress
        working-directory: ./docs
        run: node ../common/scripts/install-run-rushx.js build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

