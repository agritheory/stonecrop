name: Docs

on:
  push:
    branches:
      - development
    paths:
      - 'docs/**'
      - '**/api.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-pages
  cancel-in-progress: false

env:
  VP_GIT_HOOKS: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generates every package's api.md, which the site aggregates below.
      - name: Build
        run: pnpm run build

      # The docs site is deliberately not part of the repo-wide build: its script is named
      # "build:site" so that `vp run -r build` skips it, exactly as Rush's phased build did.
      # Aggregation into docs/reference/ happens inside this script.
      - name: Build Vitepress
        working-directory: ./docs
        run: pnpm run build:site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
