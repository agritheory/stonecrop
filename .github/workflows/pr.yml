name: PR Checks

on:
  pull_request:

# Cancel superseded runs on the same PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

# The root "prepare" script runs "vp config", which installs the Git hook dispatcher. A CI
# checkout never commits, so skip it everywhere rather than per job.
env:
  VP_GIT_HOOKS: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      packages: ${{ steps.filter.outputs.changes }}

    steps:
      # Every entry carries the two shared trees, or a PR touching only those selects no package.
      # Narrower than `tools/**`: the reports under `tools/api-reports` change on any build.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aform:
              - 'aform/**'
              - 'themes/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            atable:
              - 'atable/**'
              - 'themes/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            casl_middleware:
              - 'casl_middleware/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            code_editor:
              - 'code_editor/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            desktop:
              - 'desktop/**'
              - 'themes/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            graphql_client:
              - 'graphql_client/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            graphql_middleware:
              - 'graphql_middleware/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            node_editor:
              - 'node_editor/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            rockfoil:
              - 'rockfoil/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            schema:
              - 'schema/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            stonecrop:
              - 'stonecrop/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'
            utilities:
              - 'utilities/**'
              - 'tools/vite/**'
              - 'tools/test-support/**'

  pr-checks:
    name: Lint & Change Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Vite+'s task cache, kept across runs. Restored after Install, which creates node_modules.
      # The newest from this pull request wins, else the one publish-npm saves on development after
      # each release: a release rewrites every package.json the cache keys on, so an older one would
      # match nothing. Saved under a key of its own each run, so a later push starts warm.
      - name: Cache Build Tasks
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vp-tasks-${{ runner.os }}-

      # Oxfmt sorts package.json as part of formatting, so this is also the gate that a committed
      # package.json is in canonical key order.
      - name: Format Check
        run: pnpm run format:check

      # The catalog in pnpm-workspace.yaml makes divergence impossible for what it already lists;
      # this catches a dependency added to a second package without joining it. It also fails when a
      # package's range on Vite rejects the Vite inside Vite+, which the override never checks.
      - name: Dependency Consistency
        run: pnpm run check:deps

      # The site's parser drops the errors in a component's YAML props and renders whatever part
      # parsed, so a mis-quoted table row merges green and fails only when docs.yml prerenders the
      # page, after merge. Generating the site here would cost a full build; this reads the content
      # with that same parser and needs only the install.
      - name: Documentation Content
        run: pnpm --filter @stonecrop/nuxt --fail-if-no-match run check:documentation

      # Type-aware oxlint (oxlint-tsgolint) requires compiled .d.ts files from dependency packages
      # to exist before lint runs; without this build step, unresolvable imports appear as
      # "error typed" and trigger false positives.
      #
      # Warm from Cache Build Tasks. Replay is additive — it restores a snapshot without deleting what
      # is there — which is why this once ran cold, but that bites only a dist/ that already holds
      # stale files, and a checkout has no dist/ at all. Replayed into one, the output is byte-identical
      # to a cold build. A dependency's files are tracked inputs, so a lockfile change misses.
      - name: Build
        run: pnpm run build

      # Why each step that missed the cache missed it. run-build.mjs prints only a count, so a change
      # that stops the cache matching would otherwise show only as a slower Build.
      - name: Show Build Cache Misses
        run: grep -h 'cache miss' node_modules/.vite/last-build.log || echo "every step replayed"

      # Each build runs "api-extractor run --local", which rewrites tools/api-reports/ in place, so
      # drift only ever surfaces as a dirty working tree. The same holds for the generated docs: the
      # root build regenerates every api.md and aggregates them into the reference tree, and all
      # three are committed, so a stale one is invisible without this.
      #
      # `git status`, not `git diff`: a report generated for the first time is untracked, and diff
      # reports only tracked modifications. The loop catches a pathspec that has gone dead.
      - name: Verify API Reports And Docs Are Current
        run: |
          specs=(tools/api-reports/ nuxt/documentation/content/reference/ '*/api.md')
          for spec in "${specs[@]}"; do
            [ -n "$(git ls-files -- "$spec")" ] || { echo "::error::the pathspec $spec matches no tracked file, so this gate is watching nothing"; exit 1; }
          done
          drift=$(git status --porcelain --untracked-files=all -- "${specs[@]}")
          if [ -n "$drift" ]; then
            echo "::error::generated reports or docs are not current; rebuild and commit them"
            printf '%s\n' "$drift"
            git --no-pager diff -- "${specs[@]}"
            exit 1
          fi

      # Reads each package's packed tarball, so it must follow Build.
      - name: Verify Publish Contract
        run: pnpm run check:publish

      - name: Oxlint
        run: pnpm run lint

      # `pnpm run lint` is `vp run -r lint`, which runs each member's own lint script, and no member
      # under tools/ declares one. `vp lint` resolves paths from the cwd, so this runs at the root.
      - name: Oxlint Shared Tooling
        run: pnpm exec vp lint tools

      # The package matrix below is paths-filtered and coverage-gated, so it neither reaches this
      # member nor suits it.
      - name: Test Shared Tooling
        run: pnpm exec vp run --filter stonecrop-scripts --fail-if-no-match test

      # Repo-wide, because the per-package matrix below is paths-filtered and cannot see cross-
      # package breakage. `tsc -b` compiles only .ts and `vp build` does not typecheck, so
      # vue-tsc is the only thing that reads a .vue file — meaning a change confined to schema/**
      # could break a <script setup> block or a template binding in desktop, aform, atable,
      # node_editor or code_editor and still merge green. Projects opt in by defining a
      # `test:types` script, exactly as `lint` works. Runs after Build because vue-tsc needs
      # dependencies' .d.ts files, and both nuxt builds prepare every app, so .nuxt exists by now.
      #
      # The root script passes `--parallel`. Every check is `--noEmit` and writes only its own
      # tsbuildinfo, so none waits on another, and ordering them by the dependency graph made aform,
      # stonecrop, desktop and nuxt run one after another with free CPUs beside them.
      - name: Typecheck
        run: pnpm run test:types

      # Unlike the three-dot diff this replaces, --since reads the working tree, so a changeset
      # added in the PR counts before it is merged.
      - name: Verify Changesets
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  test-and-coverage:
    name: ${{ matrix.package }}
    needs: [changes]
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache pnpm Store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # The cache Cache Build Tasks restores in pr-checks, so only what this pull request changed
      # builds. Restore only: pr-checks builds every package, so its save holds all this would add.
      - name: Restore Build Tasks
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-tasks-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vp-tasks-${{ runner.os }}-

      # Build only the dependency closure for this package, not the whole repo.
      #
      # `{dir}` is the directory filter that keeps its traversal suffix. The other directory form,
      # `./dir`, silently drops the `...` and builds that one package and none of its dependencies.
      # --fail-if-no-match matters as much: a filter matching nothing otherwise exits 0.
      - name: Build
        run: pnpm exec vp run --filter '{${{ matrix.package }}}...' --fail-if-no-match build

      # No Typecheck step here on purpose. It used to run per-package, but this matrix is
      # paths-filtered, so it only ever checked packages whose own files changed — the hole that let
      # nuxt_grafserv accumulate 28 type errors and shipped a broken plugins.ts into every
      # scaffolded app. The `Typecheck` step in `pr-checks` now runs test:types repo-wide
      # after a full build, which strictly supersedes this. Do not reinstate it here: running
      # vue-tsc twice for every changed package buys nothing.
      - name: Run Tests
        working-directory: ./${{ matrix.package }}
        run: pnpm run test:coverage

      - name: Resolve Baseline Run ID
        id: baseline-run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch development \
            --workflow coverage-baseline.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          echo "run-id=${RUN_ID}" >> $GITHUB_OUTPUT

      - name: Download Baseline Coverage
        if: always() && steps.baseline-run.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ matrix.package }}-development
          run-id: ${{ steps.baseline-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: coverage-baseline

      - name: Post Coverage Report (with baseline)
        if: always() && hashFiles('coverage-baseline/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ matrix.package }}
          json-summary-path: ./${{ matrix.package }}/coverage/coverage-summary.json
          json-final-path: ./${{ matrix.package }}/coverage/coverage-final.json
          json-summary-compare-path: coverage-baseline/coverage-summary.json

      - name: Post Coverage Report (no baseline)
        if: always() && hashFiles('coverage-baseline/coverage-summary.json') == ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ matrix.package }}
          json-summary-path: ./${{ matrix.package }}/coverage/coverage-summary.json
          json-final-path: ./${{ matrix.package }}/coverage/coverage-final.json
