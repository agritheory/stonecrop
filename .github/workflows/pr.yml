name: PR Checks

on:
  pull_request:

# Cancel superseded runs on the same PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      packages: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aform: aform/**
            atable: atable/**
            beam: beam/**
            casl_middleware: casl_middleware/**
            desktop: desktop/**
            graphql_client: graphql_client/**
            graphql_middleware: graphql_middleware/**
            rockfoil: rockfoil/**
            schema: schema/**
            stonecrop: stonecrop/**

  pr-checks:
    name: Lint & Change Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Prettier does not need Rush; runs directly via the CLI action.
      - name: Prettier Check
        id: prettier-run
        uses: rutajdash/prettier-cli-action@v1.0.0
        with:
          config_path: ./.prettierrc.js
          ignore_path: ./.prettierignore

      - name: Prettier Output
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "The following files are not formatted:"
          echo "${{steps.prettier-run.outputs.prettier_output}}"

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache-dependency-path: '**/config/rush/pnpm-lock.yaml'
          registry-url: https://registry.npmjs.org/

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      # rush-plugins is required for the rush-sort-package-json plugin to load.
      - name: Update Autoinstallers
        run: node common/scripts/install-run-rush.js update-autoinstaller --name rush-plugins

      - name: Sort package.json
        run: node common/scripts/install-run-rush.js sort-package-json

      - name: Verify Change Files
        run: node common/scripts/install-run-rush.js change --verify

  test-and-coverage:
    name: ${{ matrix.package }}
    needs: [changes]
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache-dependency-path: '**/config/rush/pnpm-lock.yaml'
          registry-url: https://registry.npmjs.org/

      # Package-specific cache key so parallel matrix jobs don't overwrite each other.
      - name: Restore Rush Build Cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: common/temp/build-cache
          key: rush-build-cache-${{ matrix.package }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-build-cache-

      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      - name: Update Autoinstallers
        run: node common/scripts/install-run-rush.js update-autoinstaller --name rush-plugins

      # Build only the dependency closure for this package, not the whole repo.
      - name: Rush Build
        run: node common/scripts/install-run-rush.js build --to ${{ matrix.package }}

      - name: Run Tests
        working-directory: ./${{ matrix.package }}
        run: node ../common/scripts/install-run-rushx.js test:coverage

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.package }}-pull-request
          path: ./${{ matrix.package }}/coverage
          retention-days: 1

      - name: Save Rush Build Cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: common/temp/build-cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  coverage-report:
    name: Coverage Report
    needs: [changes, test-and-coverage]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.packages != '[]'

    steps:
      # Download PR coverage artifacts produced in this run (no run-id needed).
      - name: Download PR Coverage Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*-pull-request

      # Resolve the run ID of the latest successful coverage-baseline run on development,
      # then use the official download-artifact action with an explicit run-id to fetch
      # the baseline (cross-run downloads require a token + run-id).
      - name: Resolve Baseline Run ID
        id: baseline-run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch development \
            --workflow coverage-baseline.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          echo "run-id=${RUN_ID}" >> $GITHUB_OUTPUT

      - name: Download Baseline Coverage Artifacts
        if: steps.baseline-run.outputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*-development
          run-id: ${{ steps.baseline-run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Post Coverage Report
        uses: actions/github-script@v7
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        with:
          script: |
            const fs = require('fs');
            const packages = JSON.parse(process.env.PACKAGES);
            const metrics = ['lines', 'branches', 'functions', 'statements'];

            function readSummary(filePath) {
              if (!fs.existsSync(filePath)) return null;
              return JSON.parse(fs.readFileSync(filePath, 'utf8')).total;
            }

            let body = '## Coverage Report\n\n';

            for (const pkg of packages) {
              const prData  = readSummary(`coverage-${pkg}-pull-request/coverage-summary.json`);
              const baseData = readSummary(`coverage-${pkg}-development/coverage-summary.json`);

              body += `<details>\n<summary><strong>${pkg}</strong></summary>\n\n`;

              if (!prData) {
                body += `_No coverage data available._\n\n`;
              } else {
                body += `| Metric | PR | Base | Delta |\n|---|---|---|---|\n`;
                for (const metric of metrics) {
                  const prPct   = prData[metric].pct;
                  const basePct = baseData ? baseData[metric].pct : null;
                  const delta   = basePct !== null ? (prPct - basePct).toFixed(2) : null;
                  const sign    = delta > 0 ? '+' : '';
                  body += `| ${metric.charAt(0).toUpperCase() + metric.slice(1)} | ${prPct}% | ${basePct ?? 'N/A'}% | ${delta !== null ? sign + delta + '%' : 'N/A'} |\n`;
                }
                body += '\n';
              }

              body += `</details>\n\n`;
            }

            // Find and update an existing report comment, or create a new one.
            const marker = '<!-- stonecrop-coverage-report -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
