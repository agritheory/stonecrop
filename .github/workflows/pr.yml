name: PR Checks

on:
  pull_request:

# Cancel superseded runs on the same PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

# The root "prepare" script runs "vp config", which installs the Git hook dispatcher. A CI
# checkout never commits, so skip it everywhere rather than per job.
env:
  VP_GIT_HOOKS: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      packages: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            aform:
              - 'aform/**'
              - 'themes/**'
            atable:
              - 'atable/**'
              - 'themes/**'
            beam: beam/**
            casl_middleware: casl_middleware/**
            code_editor: code_editor/**
            desktop:
              - 'desktop/**'
              - 'themes/**'
            graphql_client: graphql_client/**
            graphql_middleware: graphql_middleware/**
            node_editor: node_editor/**
            rockfoil: rockfoil/**
            schema: schema/**
            stonecrop: stonecrop/**
            utilities: utilities/**

  pr-checks:
    name: Lint & Change Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier Check
        run: pnpm run format:check

      # Type-aware oxlint (oxlint-tsgolint) requires compiled .d.ts files from dependency packages
      # to exist before lint runs; without this build step, unresolvable imports appear as
      # "error typed" and trigger false positives.
      #
      # No cross-run task cache. Vite Task's cache lives in node_modules/.vite/task-cache and
      # restoring it across runs is documented as experimental, with the precondition that an
      # immediate second run reports a cache hit. It does not here: each `&&` step of a package's
      # build writes into dist/, which is also tracked as that build's input, so two consecutive
      # identical runs still miss roughly half the sub-tasks. A cold full build is ~16s, so there
      # is nothing to buy back.
      - name: Build
        run: pnpm run build

      # Each build runs "api-extractor run --local", which rewrites common/reviews/api/ in place, so
      # drift only ever surfaces as a dirty working tree.
      - name: Verify API Reports Are Current
        run: git diff --exit-code -- common/reviews/api/

      - name: Oxlint
        run: pnpm run lint

      # Repo-wide, because the per-package matrix below is paths-filtered and cannot see cross-
      # package breakage. `tsc -b` compiles only .ts and `vite build` does not typecheck, so
      # vue-tsc is the only thing that reads a .vue file — meaning a change confined to schema/**
      # could break a <script setup> block or a template binding in desktop, aform, atable,
      # node_editor, code_editor or beam and still merge green. Projects opt in by defining a
      # `test:types` script, exactly as `lint` works. Runs after Build because vue-tsc needs
      # dependencies' .d.ts files, and both nuxt builds run `dev:prepare`, so .nuxt exists by now.
      - name: Typecheck
        run: pnpm run test:types

      # "sort-package-json" rewrites the files in place, so on its own it only sorts a throwaway
      # checkout and discards the result. The "git diff" below is what actually enforces the
      # convention: it fails the build when a committed package.json is not in sorted order. Run
      # "pnpm run sort-package-json" locally and commit the result to resolve a failure here.
      - name: Sort package.json
        run: pnpm run sort-package-json

      # Scoped to package.json so an unrelated file touched by an earlier step
      # cannot fail this check with a misleading message.
      - name: Verify package.json Is Sorted
        run: git diff --exit-code -- '*package.json'

      # Unlike the three-dot diff this replaces, --since reads the working tree, so a changeset
      # added in the PR counts before it is merged.
      - name: Verify Changesets
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  test-and-coverage:
    name: ${{ matrix.package }}
    needs: [changes]
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: corepack enable

      - name: Cache pnpm Store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build only the dependency closure for this package, not the whole repo. The matrix holds
      # folder names and `vp run -t` needs the package name, so read it off the package itself.
      #
      # It must be the name: `--filter './<dir>...'` accepts the directory form but silently drops
      # the `...`, building that one package and none of its dependencies.
      - name: Resolve Package Name
        id: pkg
        run: echo "name=$(node -p "require('./${{ matrix.package }}/package.json').name")" >> $GITHUB_OUTPUT

      - name: Build
        run: pnpm exec vp run -t '${{ steps.pkg.outputs.name }}#build'

      # No Typecheck step here on purpose. It used to run per-package, but this matrix is
      # paths-filtered, so it only ever checked packages whose own files changed — the hole that let
      # nuxt_grafserv accumulate 28 type errors and shipped a broken plugins.ts into every
      # scaffolded app. The `Typecheck` step in `pr-checks` now runs test:types repo-wide
      # after a full build, which strictly supersedes this. Do not reinstate it here: running
      # vue-tsc twice for every changed package buys nothing.
      - name: Run Tests
        working-directory: ./${{ matrix.package }}
        run: pnpm run test:coverage

      - name: Resolve Baseline Run ID
        id: baseline-run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch development \
            --workflow coverage-baseline.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          echo "run-id=${RUN_ID}" >> $GITHUB_OUTPUT

      - name: Download Baseline Coverage
        if: always() && steps.baseline-run.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ matrix.package }}-development
          run-id: ${{ steps.baseline-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: coverage-baseline

      - name: Post Coverage Report (with baseline)
        if: always() && hashFiles('coverage-baseline/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ matrix.package }}
          json-summary-path: ./${{ matrix.package }}/coverage/coverage-summary.json
          json-final-path: ./${{ matrix.package }}/coverage/coverage-final.json
          json-summary-compare-path: coverage-baseline/coverage-summary.json

      - name: Post Coverage Report (no baseline)
        if: always() && hashFiles('coverage-baseline/coverage-summary.json') == ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ matrix.package }}
          json-summary-path: ./${{ matrix.package }}/coverage/coverage-summary.json
          json-final-path: ./${{ matrix.package }}/coverage/coverage-final.json
