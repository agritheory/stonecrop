name: Coverage Baseline

on:
  push:
    branches:
      - development
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '**/CHANGELOG*'

# Only one baseline at a time; cancel any in-progress run when a new push arrives.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VP_GIT_HOOKS: 0

jobs:
  coverage:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - aform
          - atable
          - beam
          - casl_middleware
          - code_editor
          - desktop
          - graphql_client
          - graphql_middleware
          - node_editor
          - rockfoil
          - schema
          - stonecrop
          - utilities

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Supplies the pnpm pinned by the root package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      # pnpm's global content-addressable store. Cached explicitly rather than through
      # setup-node's `cache: pnpm`, which runs `pnpm store path` during setup — before corepack
      # has materialized the pinned pnpm.
      - name: Cache pnpm Store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # The matrix holds folder names and `vp run -t` needs the package name, so read it off the
      # package itself. It must be the name: `--filter './<dir>...'` accepts the directory form but
      # silently drops the `...`, building that one package and none of its dependencies.
      - name: Resolve Package Name
        id: pkg
        run: echo "name=$(node -p "require('./${{ matrix.package }}/package.json').name")" >> $GITHUB_OUTPUT

      - name: Build
        run: pnpm exec vp run -t '${{ steps.pkg.outputs.name }}#build'

      - name: Run Tests
        working-directory: ./${{ matrix.package }}
        run: pnpm run test:coverage

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}-development
          path: ./${{ matrix.package }}/coverage
          retention-days: 30
