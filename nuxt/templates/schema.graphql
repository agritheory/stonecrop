# Stonecrop GraphQL Schema
# Add your type definitions here

scalar JSON

# ============================================
# Stonecrop Meta Types
# ============================================

"""
Field metadata from doctype schema
"""
type StonecropField {
	kind: String!
	fieldname: String!
	fieldtype: String!
	component: String
	label: String
	width: String
	align: String
	edit: Boolean
	mask: String
	format: String
	mode: String
	options: JSON
	required: Boolean
	readOnly: Boolean
	hidden: Boolean
	default: JSON
	validation: JSON
	cardinality: String
	source: String
}

"""
A single workflow action definition (`name` is the action's key in
WorkflowMeta.actions; the other fields mirror ActionDefinition in
@stonecrop/schema)
"""
type WorkflowAction {
	name: String!
	label: String!
	requiredFields: [String!]
	allowedStates: [String!]
	nextState: String
	stateless: Boolean
	clientHandler: String
}

"""
Workflow metadata with states and actions
"""
type WorkflowMeta {
	states: [String!]
	actions: [WorkflowAction!]
}

"""
Complete doctype metadata
"""
type DoctypeMeta {
	name: String!
	slug: String
	fields: [StonecropField!]!
	workflow: WorkflowMeta
	inherits: String
}

# ============================================
# Result Types
# ============================================

type HealthStatus {
	status: String!
	timestamp: String!
	version: String!
}

type RecordResult {
	data: JSON
	doctype: String!
	unknownLinks: [String!]
}

type RecordsResult {
	data: [JSON!]!
	doctype: String!
	count: Int!
}

type ActionResult {
	success: Boolean!
	data: JSON
	error: String
}

# ============================================
# Queries
# ============================================

type Query {
	"""
	Health check endpoint
	"""
	healthCheck: HealthStatus!

	"""
	Get metadata for a doctype
	"""
	getMeta(doctype: String!): DoctypeMeta

	"""
	Get metadata for a doctype (used by StonecropClient)
	"""
	stonecropMeta(doctype: String!): DoctypeMeta

	"""
	Get all registered doctype metadata
	"""
	stonecropAllMeta: [DoctypeMeta!]!

	"""
	Get a single record by doctype and ID
	"""
	stonecropRecord(doctype: String!, id: String!, options: JSON): RecordResult

	"""
	Get multiple records with optional filtering
	"""
	stonecropRecords(
		doctype: String!
		filters: JSON
		orderBy: String
		limit: Int
		offset: Int
		options: JSON
	): RecordsResult
}

# ============================================
# Mutations
# ============================================

type Mutation {
	"""
	Execute a doctype action
	"""
	stonecropAction(doctype: String!, action: String!, args: JSON): ActionResult!

	"""
	Create a new record
	"""
	stonecropCreate(doctype: String!, input: JSON!): RecordResult!

	"""
	Update an existing record
	"""
	stonecropUpdate(doctype: String!, id: String!, patch: JSON!): RecordResult

	"""
	Delete a record
	"""
	stonecropDelete(doctype: String!, id: String!): ActionResult!
}
