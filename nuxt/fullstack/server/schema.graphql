# @stonecrop/nuxt fullstack playground GraphQL Schema
# Demonstrates integration with Stonecrop middleware for doctype-driven data access
#
# Data Flow:
# - getMeta: Returns doctype schema from /fullstack/doctypes/*.json
# - stonecropRecord/stonecropRecords: Proxies to MockGraphQLExecutor
# - stonecropAction: Applies the guarded workflow transition

# ============================================
# JSON Scalar for dynamic data
# ============================================

scalar JSON

# ============================================
# Stonecrop Meta Types
# Types returned by getMeta and stonecropAllMeta
# ============================================

"""
Field metadata from doctype schema (mirrors ValueField in @stonecrop/schema)
"""
type StonecropField {
	kind: String!
	fieldname: String!
	fieldtype: String
	component: String
	primaryKey: Boolean
	computed: Boolean
	language: String
	doctype: String
	label: String
	width: String
	align: String
	edit: Boolean
	mask: String
	format: String
	mode: String
	options: JSON
	required: Boolean
	readOnly: Boolean
	hidden: Boolean
	default: JSON
	validation: JSON
	cardinality: String
	source: String
}

"""
A single workflow action definition (`name` is the action's key in
WorkflowMeta.actions; the other fields mirror ActionDefinition in
@stonecrop/schema)
"""
type WorkflowAction {
	name: String!
	label: String!
	requiredFields: [String!]
	allowedStates: [String!]
	nextState: String
	stateless: Boolean
	selfTransition: Boolean
	clientHandler: String
}

"""
Workflow metadata with states and actions
"""
type WorkflowMeta {
	states: [String!]
	actions: [WorkflowAction!]
}

"""
Complete doctype metadata
"""
type DoctypeMeta {
	name: String!
	slug: String
	fields: [StonecropField!]!
	workflow: WorkflowMeta
	inherits: String
}

# ============================================
# Stonecrop Record Types
# Generic record access via MockGraphQLExecutor
# ============================================

"""
Result of a single record query
"""
type RecordResult {
	data: JSON
	doctype: String!
	unknownLinks: [String!]
}

"""
Result of a list query with count
"""
type RecordsResult {
	data: [JSON!]!
	doctype: String!
	count: Int!
}

"""
Result of an action execution
"""
type ActionResult {
	success: Boolean!
	data: JSON
	error: String
}

# ============================================
# System Types
# ============================================

type HealthStatus {
	status: String!
	timestamp: String!
	version: String!
}

type ServerInfo {
	name: String!
	version: String!
	environment: String!
	features: [String!]!
}

# ============================================
# Queries
# ============================================

type Query {
	# -------------------------------------------
	# Stonecrop Doctype Meta Queries
	# Returns schema definitions from /doctypes/*.json
	# -------------------------------------------

	"""
	Get metadata for a specific doctype by name
	"""
	getMeta(doctype: String!): DoctypeMeta

	"""
	Alias for getMeta - matches graphql_client query name
	"""
	stonecropMeta(doctype: String!): DoctypeMeta

	"""
	Get all registered doctype metadata
	"""
	stonecropAllMeta: [DoctypeMeta!]!

	# -------------------------------------------
	# Stonecrop Record Queries
	# Proxies to MockGraphQLExecutor -> in-memory data
	# -------------------------------------------

	"""
	Get a single record by doctype and ID
	"""
	stonecropRecord(doctype: String!, id: String!, options: JSON): RecordResult

	"""
	Get multiple records with optional filtering
	"""
	stonecropRecords(
		doctype: String!
		filters: JSON
		orderBy: String
		limit: Int
		offset: Int
		options: JSON
	): RecordsResult

	# -------------------------------------------
	# System Queries
	# -------------------------------------------

	"""
	Health check endpoint
	"""
	healthCheck: HealthStatus!

	"""
	Server information and enabled features
	"""
	serverInfo: ServerInfo!
}

# ============================================
# Mutations
# ============================================

type Mutation {
	# -------------------------------------------
	# Stonecrop Action Mutation
	# Applies the guarded workflow transition
	# -------------------------------------------

	"""
	Execute a doctype action (e.g., activate_user, submit_order)
	"""
	stonecropAction(doctype: String!, action: String!, args: JSON): ActionResult!

	# -------------------------------------------
	# Stonecrop Record Mutations
	# CRUD operations via MockGraphQLExecutor
	# -------------------------------------------

	"""
	Create a new record
	"""
	stonecropCreate(doctype: String!, input: JSON!): RecordResult!

	"""
	Update an existing record
	"""
	stonecropUpdate(doctype: String!, id: String!, patch: JSON!): RecordResult

	"""
	Delete a record
	"""
	stonecropDelete(doctype: String!, id: String!): ActionResult!
}
