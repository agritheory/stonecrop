"""
Sample GraphQL schema for nuxt-grafserv playground
Demonstrates integration with CASL, graphql-middleware, and rockfoil
"""
scalar JSON

"""
User type with role-based access control
"""
type User {
	id: ID!
	name: String!
	email: String!
	role: String!
	createdAt: String
	updatedAt: String
}

"""
Order type for demonstrating relationships
"""
type Order {
	id: ID!
	userId: ID!
	user: User
	status: String!
	total: Float!
	items: [OrderItem!]!
	createdAt: String
}

"""
Order item type
"""
type OrderItem {
	id: ID!
	productName: String!
	quantity: Int!
	price: Float!
}

"""
Query operations
"""
type Query {
	"""
	Simple hello world query
	"""
	hello: String!

	"""
	Health check ping
	"""
	ping: Boolean!

	"""
	Get all users (requires read permission)
	"""
	users: [User!]!

	"""
	Get a user by ID
	"""
	user(id: ID!): User

	"""
	Get all orders
	"""
	orders: [Order!]!

	"""
	Get orders for a specific user
	"""
	userOrders(userId: ID!): [Order!]!
}

"""
Mutation operations
"""
type Mutation {
	"""
	Echo back the input message
	"""
	echo(message: String!): String!

	"""
	Create a new user
	"""
	createUser(name: String!, email: String!): User!

	"""
	Update an existing user
	"""
	updateUser(id: ID!, name: String, email: String, role: String): User

	"""
	Delete a user
	"""
	deleteUser(id: ID!): Boolean!

	"""
	Create a new order
	"""
	createOrder(userId: ID!, items: [OrderItemInput!]!): Order!

	"""
	Update order status
	"""
	updateOrderStatus(id: ID!, status: String!): Order
}

"""
Input type for order items
"""
input OrderItemInput {
	productName: String!
	quantity: Int!
	price: Float!
}
